services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  weakapp:
    image: weak-app
    container_name: weakapp
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

  data-ingestor:
    build:
      context: .
      dockerfile: src/DataIngestorService.Host/Dockerfile
    container_name: data-ingestor
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
      - WeakApp__BaseUrl=http://weakapp:8080
      - WeakApp__MeteringEndpoint=${WEAKAPP_METERING_ENDPOINT}
      - WeakApp__TimeoutSeconds=${WEAKAPP_TIMEOUT_SECONDS}
      - WeakApp__RetryCount=${WEAKAPP_RETRY_COUNT}
      - WeakApp__CircuitBreakerFailureCount=${WEAKAPP_CB_FAILURE_COUNT}
      - WeakApp__CircuitBreakerBreakDurationSeconds=${WEAKAPP_CB_BREAK_DURATION}
      - WeakApp__ApiKey=${WEAKAPP_API_KEY}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - RabbitMQ__ExchangeName=${RABBITMQ_EXCHANGE}
      - RabbitMQ__QueueName=${RABBITMQ_QUEUE}
      - RabbitMQ__QueueKey=${RABBITMQ_QUEUE_KEY}
      - Polling__IntervalSeconds=${POLLING_INTERVAL}
    
    depends_on:
      rabbitmq:
        condition: service_healthy
      weakapp:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl -f http://localhost:5000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - data-ingestor
    networks:
      - app-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      -  ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - loki
      - data-ingestor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

networks:
  app-network:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
