name: Build, test and analyze by sonar
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore DataIngestorService.slnx
    - name: Build
      run: dotnet build DataIngestorService.slnx --no-restore --configuration Release
    - name: Run Unit Tests
      run: dotnet test DataIngestorService.slnx --no-build --configuration Release --filter "FullyQualifiedName~Core.Tests|FullyQualifiedName~Infrastructure.Tests" --collect:"XPlat Code Coverage" --results-directory coverage
    - name: Run Integration Tests
      run: dotnet test DataIngestorService.slnx --no-build --configuration Release --filter "FullyQualifiedName~Host.Tests" --collect:"XPlat Code Coverage" --results-directory coverage
    - name: Copy Coverage Reports
      run: |
        find coverage -name "coverage.cobertura.xml" -exec cp {} coverage.xml \;
    - name: Build Docker Image
      run: docker build -t data-ingestor-service:${{ github.sha }} -f src/DataIngestorService.Host/Dockerfile .
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
  sonar-scan:
    name: Sonar analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"fjord-code_DataIngestorService" /o:"snow-flake" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"